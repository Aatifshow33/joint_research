[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "joint-research"
version = "0.1.0"
description = "Joint Polymarket × crypto research warehouse and pattern-discovery toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "pyarrow>=17.0.0,<22.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "httpx>=0.27.0,<0.29.0",
  "typer>=0.18.0,<0.19.0",
  "duckdb>=1.1.0,<2.0.0",
  "yfinance>=0.2.40,<0.3.0",
  "anthropic>=0.40.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<0.24.0",
  "ruff>=0.5.0,<0.6.0",
  "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
joint-research = "joint_research.cli:app"
predmarket-arb = "joint_research.predmarket_arb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/joint_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls (typer.Option) in argument defaults by design.
"src/joint_research/predmarket_arb/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
